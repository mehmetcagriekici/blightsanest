apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: semantic-api-cache
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-api
  labels:
    app: semantic-api
spec:
  # semantic_engine.SemanticSearch (blightsanest_semantic_search/main.py) keeps
  # embeddings in a single in-process Python object with no shared backing
  # store - do not scale this beyond 1 replica, a second pod would have its
  # own independent embedding cache and answer /search inconsistently.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: semantic-api
  template:
    metadata:
      labels:
        app: semantic-api
    spec:
      containers:
        - name: semantic-api
          image: blightsanest-semantic:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: cache
              mountPath: /app/cache
              subPath: embeddings
            - name: cache
              mountPath: /root/.cache/huggingface
              subPath: huggingface
          readinessProbe:
            httpGet: {path: /docs, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /docs, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: semantic-api-cache
---
apiVersion: v1
kind: Service
metadata:
  name: semantic-api
  labels:
    app: semantic-api
spec:
  selector:
    app: semantic-api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
