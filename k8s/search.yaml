apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels:
    app: search
spec:
  # also an interactive REPL - see server.yaml for the same note.
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq...; sleep 2; done"]
      containers:
        - name: search
          image: blightsanest-go:local
          imagePullPolicy: Never
          command: ["./search"]
          stdin: true
          tty: true
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: {name: blightsanest-secrets, key: RABBITMQ_URL}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: blightsanest-secrets, key: DATABASE_URL}
            - name: SUBSCRIBER_PREFETCH
              valueFrom:
                configMapKeyRef: {name: blightsanest-config, key: SUBSCRIBER_PREFETCH}
            - name: SEMANTIC_API_URL
              valueFrom:
                configMapKeyRef: {name: blightsanest-config, key: SEMANTIC_API_URL}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
