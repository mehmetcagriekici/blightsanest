apiVersion: batch/v1
kind: Job
metadata:
  name: blightsanest-migrate
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: blightsanest-go:local
          imagePullPolicy: Never
          command: ["./migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: blightsanest-secrets, key: DATABASE_URL}
