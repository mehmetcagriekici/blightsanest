name: ci

on:
  push:
    branches: ["blight_dev"]
  pull_request:
     branches: ["main"]

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.0"

    - name: Check formatting issues
      run: |
        output=$(go fmt ./...)
        test -z "$output"

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run: staticcheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    environment: ci

    steps:
    - name: Check out code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.0"

    - name: Build and start the services
      run: docker compose up --build -d

    - name: Run the internal tests
      run: go test -cover ./...

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run gosec
      run: gosec ./...
